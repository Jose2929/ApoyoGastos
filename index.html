<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Gastos Médicos Chávez</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png" />
<meta name="theme-color" content="#1f6fd6" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#4d8fe0" media="(prefers-color-scheme: dark)" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Gastos Chávez" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <span class="app-title" id="app-title">💊 Gastos Médicos Chávez</span>
    <span class="header-actions">
      <button id="btn-theme" class="btn-theme-toggle" aria-label="Cambiar tema claro/oscuro">🌙</button>
      <button id="btn-font-size" class="btn-font-size-toggle" aria-pressed="false" aria-label="Letra normal. Tocar para activar letra grande.">A</button>
      <button id="btn-salir" class="btn btn-link" hidden>Salir</button>
    </span>
  </header>

  <main id="view-container" class="view-container"></main>

  <nav id="bottom-nav" class="bottom-nav" hidden>
    <button class="nav-btn" data-nav="home">
      <span class="nav-icon">🏠</span><span>Inicio</span>
    </button>
    <button class="nav-btn" data-nav="movimientos">
      <span class="nav-icon">📋</span><span>Movimientos</span>
    </button>
    <button class="nav-btn" data-nav="contribuciones">
      <span class="nav-icon">📅</span><span>Aportes</span>
    </button>
    <button class="nav-btn" data-nav="avisos">
      <span class="nav-icon">📢</span><span>Avisos</span>
    </button>
    <button class="nav-btn" data-nav="admin" hidden>
      <span class="nav-icon">⚙️</span><span>Admin</span>
    </button>
    <button class="nav-btn" data-nav="acerca">
      <span class="nav-icon">ℹ️</span><span>Acerca</span>
    </button>
  </nav>

  <script type="module" src="js/main.js"></script>
</body>
</html>
